<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fairy Tale ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #ffd700;
    --rose: #ff69b4;
    --violet: #da70d6;
    --text-color: #fff;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    font-family: 'Quicksand', sans-serif;
    /* Nền tối để làm nổi bật ánh sáng */
    background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #4a1942 100%);
    background-size: 200% 200%;
    animation: bgMove 15s ease infinite alternate;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--text-color);
    perspective: 1200px;
  }

  @keyframes bgMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  /* --- LỚP ÁNH SÁNG RỰC RỠ (AURA) --- */
  .aurora {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  
  .aurora-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.6;
    animation: floatBlob 10s infinite alternate;
  }
  
  .aurora-blob:nth-child(1) { background: var(--rose); width: 40vw; height: 40vw; top: -10%; left: -10%; }
  .aurora-blob:nth-child(2) { background: var(--violet); width: 35vw; height: 35vw; bottom: -10%; right: -10%; animation-delay: -5s; }
  .aurora-blob:nth-child(3) { background: var(--gold); width: 25vw; height: 25vw; top: 40%; left: 50%; opacity: 0.3; animation-delay: -2s; }

  @keyframes floatBlob {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(50px, 50px) scale(1.1); }
  }

  /* --- LỚP CÁNH HOA PHA LÊ RƠI --- */
  #petals-container {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  
  .petal {
    position: absolute;
    background: linear-gradient(135deg, rgba(255,105,180,0.8), rgba(218,112,214,0.8));
    box-shadow: 0 0 15px 2px rgba(255, 105, 180, 0.6);
    border-radius: 50% 0 50% 0;
    backdrop-filter: blur(2px);
    animation: fallAndSpin linear forwards;
  }

  @keyframes fallAndSpin {
    0% { transform: translateY(-10vh) rotate(0deg) rotateY(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg) rotateY(360deg); opacity: 0; }
  }

  /* --- MÀN HÌNH CHỜ --- */
  #welcomeScreen {
    position: fixed;
    inset: 0;
    background: rgba(26, 11, 46, 0.9);
    backdrop-filter: blur(15px);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  
  .welcome-text {
    font-family: 'Great Vibes', cursive;
    font-size: 60px;
    background: linear-gradient(to right, var(--gold), var(--rose), var(--violet));
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 20px;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
  }

  #enterBtn {
    padding: 16px 45px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: #1a0b2e;
    background: linear-gradient(45deg, var(--gold) 0%, #fff 100%);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px var(--gold), 0 10px 20px rgba(0,0,0,0.5);
    transition: all 0.3s ease;
    letter-spacing: 2px;
  }
  
  #enterBtn:hover {
    transform: scale(1.1) translateY(-3px);
    box-shadow: 0 0 40px var(--gold), 0 15px 30px rgba(0,0,0,0.6);
  }

  /* --- THẺ 3D CHÍNH --- */
  .scene {
    position: relative;
    z-index: 10;
    width: 90%;
    max-width: 850px;
  }

  .fairy-card {
    position: relative;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 35px;
    box-shadow: 
      0 0 50px rgba(255, 105, 180, 0.2),
      inset 0 0 0 1px rgba(255, 255, 255, 0.2),
      inset 0 0 30px rgba(218, 112, 214, 0.2);
    text-align: center;
    transform-style: preserve-3d;
    transition: transform 0.1s ease, opacity 1s ease;
    opacity: 0;
    transform: translateY(50px);
  }

  .fairy-card.active {
    opacity: 1;
    transform: translateY(0);
  }

  /* Khung ảnh phát sáng rực rỡ */
  .image-wrapper {
    position: relative;
    border-radius: 20px;
    padding: 6px;
    background: linear-gradient(45deg, var(--rose), var(--violet), var(--gold), var(--rose));
    background-size: 300% 300%;
    animation: borderGlow 4s linear infinite;
    transform: translateZ(40px);
    box-shadow: 0 0 30px var(--rose), 0 0 60px var(--violet);
  }

  @keyframes borderGlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  .image-wrapper img {
    width: 100%;
    display: block;
    border-radius: 16px;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* Chữ */
  .content {
    transform: translateZ(60px);
    margin-top: 35px;
  }

  .title {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(45px, 7vw, 65px);
    background: linear-gradient(to right, #fff, var(--rose), #fff);
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
    margin-bottom: 5px;
  }

  .subtitle {
    font-size: clamp(14px, 2vw, 16px);
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 0 0 10px var(--gold);
    height: 24px;
    margin-bottom: 30px;
  }

  /* Nút bấm Hoàng gia */
  .btn {
    padding: 16px 45px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: #1a0b2e;
    background: linear-gradient(135deg, var(--gold) 0%, #fff 100%);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 20px var(--gold), 0 10px 20px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
  }

  .btn::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
    transform: rotate(45deg);
    animation: shineBtn 3s infinite;
  }

  @keyframes shineBtn {
    0% { left: -200%; }
    100% { left: 200%; }
  }

  .btn:hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 0 40px var(--gold), 0 15px 30px rgba(0,0,0,0.4);
  }

  /* Nút Nhạc */
  #musicBtn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 100;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(26, 11, 46, 0.6);
    backdrop-filter: blur(10px);
    border: 2px solid var(--gold);
    color: var(--gold);
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 0 20px var(--gold);
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  #musicBtn.show { display: flex; }
  #musicBtn.playing .icon { animation: spin 3s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .fairy-card { padding: 20px; border-radius: 20px; }
    .title { font-size: 40px; }
    #musicBtn { bottom: 20px; right: 20px; width: 50px; height: 50px; font-size: 22px; }
  }
</style>
</head>

</div>

  /* 1. CẤU HÌNH ÂM THANH */
  const MUSIC_FILE = "nhac.mp3"; 
  const welcomeScreen = document.getElementById('welcomeScreen');
  const enterBtn = document.getElementById('enterBtn');
  const card = document.getElementById('card');
  const musicBtn = document.getElementById('musicBtn');
  
  let audio = new Audio(MUSIC_FILE);
  audio.loop = true;
  audio.volume = 0.6;
  audio.load();

  let isPlaying = false;

  enterBtn.addEventListener('click', () => {
    audio.play().then(() => {
      isPlaying = true;
      musicBtn.classList.add('show', 'playing');
    }).catch(e => {
      musicBtn.classList.add('show');
    });

    welcomeScreen.style.opacity = '0';
    welcomeScreen.style.transform = 'scale(1.1)';
    
    setTimeout(() => {
      welcomeScreen.remove();
      card.classList.add('active');
      startTypewriter();
    }, 1000);
  });

  musicBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isPlaying) {
      audio.pause();
      musicBtn.classList.remove('playing');
      isPlaying = false;
    } else {
      audio.play();
      musicBtn.classList.add('playing');
      isPlaying = true;
    }
  });

  /* 2. HIỆU ỨNG 3D PARALLAX */
  document.addEventListener('mousemove', (e) => {
    if (!card.classList.contains('active')) return;
    const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
    const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
    const limit = 12;
    const rotateX = Math.max(Math.min(yAxis, limit), -limit);
    const rotateY = Math.max(Math.min(xAxis, limit), -limit);
    card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
  });

  document.addEventListener('mouseleave', () => {
    card.style.transform = `rotateX(0deg) rotateY(0deg)`;
    card.style.transition = 'transform 0.6s ease';
    setTimeout(() => { card.style.transition = 'transform 0.1s ease'; }, 600);
  });

  /* 3. HIỆU ỨNG CHỮ GÕ */
  const text = "Nơi lưu giữ những điều ngọt ngào nhất...";
  let i = 0;
  function startTypewriter() {
    if (i < text.length) {
      document.getElementById("typewriter").innerHTML += text.charAt(i);
      i++;
      setTimeout(startTypewriter, 80);
    }
  }

  /* 4. MƯA CÁNH HOA PHA LÊ */
  const petalsContainer = document.getElementById('petals-container');
  
  function createPetal() {
    const petal = document.createElement('div');
    petal.classList.add('petal');
    
    // Kích thước
    const size = Math.random() * 20 + 10;
    petal.style.width = `${size}px`;
    petal.style.height = `${size}px`;
    
    // Vị trí
    petal.style.left = `${Math.random() * 100}vw`;
    petal.style.top = `-20px`;
    
    // Thời gian rơi
    const duration = Math.random() * 4 + 4; 
    petal.style.animationDuration = `${duration}s`;
    
    petalsContainer.appendChild(petal);
    
    setTimeout(() => {
      petal.remove();
    }, duration * 1000);
  }

  // Tạo cánh hoa nhanh hơn (dày đặc hơn)
  setInterval(createPetal, 200);

  /* 5. CHỐNG LƯU ẢNH */
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => {
    if (e.target.nodeName === 'IMG') e.preventDefault();
  });
  const img = document.querySelector('.image-wrapper img');
  if (img) {
    img.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  }
</script>

</body>
</html>
